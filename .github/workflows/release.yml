name: Release

# Runs only when triggered by hand from the Actions tab, or when a
# version tag (v1.2.3) is pushed. Never on a normal push/PR.
on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # tauri-action derives the release tag from src-tauri/tauri.conf.json
  # (tagName: v__VERSION__ below), NOT from the pushed git tag. If the two
  # disagree, the build silently publishes to the *old* version's release
  # instead of the tag you just pushed. Fail fast here so that can't happen.
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Pushed tag must match tauri.conf.json version
        if: github.event_name == 'push'
        shell: bash
        run: |
          version=$(node -p "require('./src-tauri/tauri.conf.json').version")
          expected="v${version}"
          if [ "${{ github.ref_name }}" != "$expected" ]; then
            echo "::error::Tag ${{ github.ref_name }} != $expected (src-tauri/tauri.conf.json version $version). Bump package.json, src-tauri/Cargo.toml, src-tauri/Cargo.lock and src-tauri/tauri.conf.json to match before tagging."
            exit 1
          fi
          echo "Tag ${{ github.ref_name }} matches version $version."

  build:
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS: one universal (Intel + Apple Silicon) .dmg / .app
          - platform: macos-latest
            args: "--target universal-apple-darwin"
            rust-targets: "aarch64-apple-darwin,x86_64-apple-darwin"
          # Linux: AppImage + .deb (Ubuntu 22.04 is the safe webkit baseline)
          - platform: ubuntu-22.04
            args: "--bundles appimage,deb"
            rust-targets: ""
          # Windows: NSIS installer (the raw portable .exe is uploaded
          # separately in the last step)
          - platform: windows-latest
            args: "--bundles nsis"
            rust-targets: ""

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v5

      - name: Install Linux build dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxdo-dev \
            libssl-dev \
            patchelf \
            libfuse2 \
            build-essential \
            curl wget file

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      - name: Build app and attach to release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Signs the updater artifacts and generates latest.json. The
          # private key is the minisign key generated with
          # `tauri signer generate` (public half lives in
          # tauri.conf.json > plugins.updater.pubkey). The key was
          # generated with an empty passphrase, so the password var is a
          # literal "" — it still has to be *set* (an absent var makes the
          # bundler fall through to an interactive prompt that hangs CI),
          # but GitHub rejects empty secrets so it can't come from one.
          # See UPDATER.md.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        with:
          # __VERSION__ is replaced with the version in src-tauri/tauri.conf.json
          tagName: v__VERSION__
          releaseName: "Daag v__VERSION__"
          releaseBody: |
            Download the file for your platform below.

            - **Windows** — `*_x64-setup.exe` (installer) or `Daag-portable-x64.exe` (no install needed)
            - **Linux** — `*_amd64.AppImage` or `*_amd64.deb`
            - **macOS** — `*_universal.dmg`

            Once installed, Daag checks this releases page for newer
            versions on launch and can update itself in place (Settings →
            Check for updates).

            **macOS first launch:** the app is unsigned, so Gatekeeper will block it. Right-click the app → Open (macOS 14 and earlier), or open it once then go to System Settings → Privacy & Security → "Open Anyway" (macOS 15+). Or from a terminal: `xattr -dr com.apple.quarantine /Applications/Daag.app`
          # Manual runs produce a draft (no git tag until you publish it);
          # a pushed v* tag publishes the release immediately.
          releaseDraft: ${{ github.event_name == 'workflow_dispatch' }}
          prerelease: false
          # Upload latest.json (the in-app updater's manifest) to the
          # release alongside the signed bundles. Default is already true
          # when signing keys are set; pinned here because it's load-bearing.
          includeUpdaterJson: true
          args: ${{ matrix.args }}

      - name: Read app version
        id: version
        shell: bash
        run: echo "version=$(node -p "require('./src-tauri/tauri.conf.json').version")" >> "$GITHUB_OUTPUT"

      # The macOS .app.tar.gz (+ .sig) is deliberately kept on the release —
      # it's the artifact the in-app updater pulls on macOS. Fresh installs
      # still use the .dmg.

      - name: Upload standalone Windows exe
        if: matrix.platform == 'windows-latest'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # The raw compiled binary in target/release (not a bundle, so
          # tauri-action doesn't upload it). Glob rather than hardcode the
          # name, which follows the Cargo crate / productName.
          exe=$(find src-tauri/target/release -maxdepth 1 -type f -name '*.exe' | head -n1)
          echo "Found portable exe: $exe"
          cp "$exe" "Daag-portable-x64.exe"
          gh release upload "v${{ steps.version.outputs.version }}" "Daag-portable-x64.exe" --clobber
