[package]
name = "daag"
version = "1.0.0"
description = "Daag — local-first PDF annotator with autosave"
authors = ["Asif Mahmood"]
license = "MIT"
repository = "https://github.com/asifm91/daag"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
