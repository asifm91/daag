[package]
name = "daag"
version = "1.0.0"
description = "Daag — local-first PDF annotator with autosave"
authors = ["Asif Mahmood"]
license = "MIT"
repository = "https://github.com/asifm91/daag"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Only used by the summarize_comments command (AI comment summary). rustls
# rather than native-tls so a Windows build needs no system OpenSSL.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }

# Windows-only: reach the WebView2 controller in main.rs to turn off the
# browser accelerator keys (F5 / Ctrl+R reload etc). Both crates are already
# in the tree via wry — pinned to the versions it resolves.
[target.'cfg(windows)'.dependencies]
webview2-com = "0.38"
windows-core = "0.61"
